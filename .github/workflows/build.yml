name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Prepare Clean Flutter Project
        run: |
          # 備份既有的 lib 資料夾（如果有的話）
          mkdir -p ../backup_lib
          cp -r lib/* ../backup_lib/ || true

          # 清理並建立乾淨的 Android / Flutter 專案結構
          rm -rf android
          flutter create --platforms=android --org com.example --project-name family_alert_app .
          
          # 將套件加回 pubspec
          flutter pub add flutter_local_notifications

          # 將 lib/main.dart 還原回來
          mkdir -p lib
          cp -r ../backup_lib/* lib/ || true

          # 自動修改 Android minSdkVersion 為 21
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0
          name: Family Alert v1.0.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
